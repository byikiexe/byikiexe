RUNNING
</text>

<!-- PROCESS 3 -->

<text x="58" y="253" class="mono" font-size="11" fill="#A5B0B5">
new_ideas
</text>

<circle cx="420" cy="249" r="3" fill="#47E0FF"/>

<text x="535" y="253" text-anchor="end"

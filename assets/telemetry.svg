IMPROVING
</text>

<!-- PROCESS 5 -->

<text x="58" y="319" class="mono" font-size="11" fill="#A5B0B5">
next_project.sh
</text>

<circle cx="420" cy="315" r="3" fill="#47E0FF"/>

<text x="535" y="319" text-anchor="end"

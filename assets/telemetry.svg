RUNNING
</text>

<!-- PROCESS 2 -->

<text x="58" y="220" class="mono" font-size="11" fill="#A5B0B5">
curiosity.exe
</text>

<circle cx="420" cy="216" r="3" fill="#47E0FF"/>

<text x="535" y="220" text-anchor="end"

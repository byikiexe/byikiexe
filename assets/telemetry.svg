<!-- HEADER -->

<circle cx="34" cy="33" r="4" fill="#47E0FF"/>

<text x="50" y="37" class="mono" font-size="11"
 letter-spacing="2" fill="#77858C">
BYIKI.OS / TELEMETRY
</text>

<text x="1164" y="37" text-anchor="end"

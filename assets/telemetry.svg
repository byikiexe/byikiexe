</text>

<!-- PROCESS 1 -->

<text x="58" y="187" class="mono" font-size="11" fill="#A5B0B5">
creative_engine
</text>

<circle cx="420" cy="183" r="3" fill="#47E0FF"/>

<text x="535" y="187" text-anchor="end"

<text x="624" y="256" class="mono" font-size="10" fill="#77858C">
EXPERIMENT
</text>

<rect x="760" y="248" width="270" height="6" rx="3" fill="#1C252B"/>
<rect x="760" y="248" width="216" height="6" rx="3" fill="#47E0FF"/>

<text x="1135" y="256" text-anchor="end"

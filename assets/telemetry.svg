</text>

<!-- CURIOSITY -->

<text x="624" y="184" class="mono" font-size="10" fill="#77858C">
CURIOSITY
</text>

<rect x="760" y="176" width="270" height="6" rx="3" fill="#1C252B"/>
<rect x="760" y="176" width="270" height="6" rx="3" fill="#47E0FF"/>

<text x="1135" y="184" text-anchor="end"

CURRENT SIGNAL
</text>

<text x="624" y="320" class="mono" font-size="11" fill="#F1F5F7">
CODE
<tspan fill="#354047"> × </tspan>
ART
<tspan fill="#354047"> × </tspan>
CURIOSITY

<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none"
xmlns="http://www.w3.org/2000/svg">

<defs>
<radialGradient id="telemetryGlow" cx="0" cy="0" r="1"
 gradientUnits="userSpaceOnUse"
 gradientTransform="translate(880 210) rotate(160) scale(520 340)">
    <stop stop-color="#47E0FF" stop-opacity=".06"/>
    <stop offset="1" stop-color="#47E0FF" stop-opacity="0"/>
</radialGradient>

<style>
.mono {
    font-family:"SFMono-Regular","Cascadia Code","Roboto Mono",
    "Liberation Mono",Consolas,monospace;
}
.sans {
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
</style>
</defs>

<!-- CARD -->

<rect x="1" y="1" width="1198" height="428" rx="16"
 fill="#080B0D" stroke="#1C252B" stroke-width="2"/>

<rect x="2" y="2" width="1196" height="426" rx="15"

</text>

<!-- PROCESS 4 -->

<text x="58" y="286" class="mono" font-size="11" fill="#A5B0B5">
consistency.exe
</text>

<circle cx="420" cy="282" r="3" fill="#77858C"/>

<text x="535" y="286" text-anchor="end"

06
</text>

<line x1="30" y1="59" x2="1170" y2="59" stroke="#1C252B"/>

<!-- COMMAND -->

<text x="35" y="96" class="mono" font-size="11" fill="#47E0FF">
&gt;
<tspan dx="7" fill="#77858C">systemctl status creative-engine</tspan>
</text>

<!-- LEFT PANEL -->

<rect x="35" y="120" width="535" height="224" rx="10"

<!-- FOOTER -->

<line x1="30" y1="369" x2="1170" y2="369" stroke="#1C252B"/>

<circle cx="36" cy="399" r="3" fill="#47E0FF"/>

<text x="49" y="403" class="mono" font-size="9"
 letter-spacing="1" fill="#77858C">
NO PRODUCTIVITY METRICS DETECTED
</text>

<text x="1164" y="403" text-anchor="end"

<svg
    width="1200"
    height="420"
    viewBox="0 0 1200 420"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
>

    <defs>
        <!-- Background -->
        <linearGradient id="background" x1="0" y1="0" x2="1200" y2="420">
            <stop offset="0%" stop-color="#080B0D"/>
            <stop offset="100%" stop-color="#0B1013"/>
        </linearGradient>

        <!-- Very subtle cyan glow -->
        <radialGradient id="cyanGlow" cx="0" cy="0" r="1"
            gradientUnits="userSpaceOnUse"
            gradientTransform="translate(875 190) rotate(150) scale(500 320)">
            <stop stop-color="#47E0FF" stop-opacity="0.08"/>
            <stop offset="1" stop-color="#47E0FF" stop-opacity="0"/>
        </radialGradient>

        <filter id="smallGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4"/>
        </filter>

        <style>
            .mono {
                font-family:
                    "SFMono-Regular",
                    "Cascadia Code",
                    "Roboto Mono",
                    "Liberation Mono",
                    Consolas,
                    monospace;
            }

            .sans {
                font-family:
                    Inter,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
            }

            .cursor {
                animation: blink 1.1s steps(2, start) infinite;
            }

            @keyframes blink {
                50% {
                    opacity: 0;
                }
            }
        </style>
    </defs>


    <!-- ===================================================== -->
    <!-- WINDOW                                                 -->
    <!-- ===================================================== -->

    <rect
        x="1"
        y="1"
        width="1198"
        height="418"
        rx="18"
        fill="url(#background)"
        stroke="#1C252B"
        stroke-width="2"
    />

    <!-- Ambient light -->
    <rect
        x="2"
        y="2"
        width="1196"
        height="416"
        rx="17"
        fill="url(#cyanGlow)"
    />


    <!-- ===================================================== -->
    <!-- TITLE BAR                                              -->
    <!-- ===================================================== -->

    <line
        x1="1"
        y1="58"
        x2="1199"
        y2="58"
        stroke="#1C252B"
    />

    <!-- Window controls -->

    <circle cx="29" cy="29" r="5" fill="#354047"/>
    <circle cx="49" cy="29" r="5" fill="#354047"/>
    <circle cx="69" cy="29" r="5" fill="#47E0FF"/>

    <!-- Small cyan glow behind active dot -->

    <circle
        cx="69"
        cy="29"
        r="10"
        fill="#47E0FF"
        fill-opacity="0.08"
        filter="url(#smallGlow)"
    />

    <!-- Application title -->

    <text
        x="600"
        y="34"
        text-anchor="middle"
        class="mono"
        font-size="12"
        letter-spacing="2"
        fill="#77858C"
    >
        BYIKI.EXE / PROFILE
    </text>

    <!-- Version -->

    <text
        x="1165"
        y="34"
        text-anchor="end"
        class="mono"
        font-size="11"
        letter-spacing="1"
        fill="#536168"
    >
        v26.8
    </text>


    <!-- ===================================================== -->
    <!-- LEFT COLUMN                                            -->
    <!-- ===================================================== -->

    <!-- command -->

    <text
        x="72"
        y="112"
        class="mono"
        font-size="15"
        fill="#77858C"
    >
        <tspan fill="#47E0FF">&gt;</tspan>
        <tspan dx="8">./whoami</tspan>
    </text>


    <!-- Name -->

    <text
        x="70"
        y="195"
        class="sans"
        font-size="70"
        font-weight="700"
        letter-spacing="-3"
        fill="#F1F5F7"
    >
        Victoria Núñez
    </text>

    <!-- Cursor -->

    <rect
        class="cursor"
        x="262"
        y="147"
        width="7"
        height="52"
        rx="1"
        fill="#47E0FF"
    />


    <!-- Role -->

    <text
        x="74"
        y="232"
        class="mono"
        font-size="16"
        letter-spacing="4"
        fill="#47E0FF"
    >
        WEB DEVELOPER
    </text>


    <!-- Description -->

    <text
        x="73"
        y="286"
        class="sans"
        font-size="17"
        fill="#A5B0B5"
    >
        Building my corner of the internet.
    </text>


    <!-- ===================================================== -->
    <!-- TECHNOLOGY LINE                                        -->
    <!-- ===================================================== -->

    <g class="mono" font-size="12" letter-spacing="1">

        <text x="73" y="331" fill="#77858C">PHP</text>

        <circle cx="116" cy="327" r="2" fill="#354047"/>

        <text x="132" y="331" fill="#77858C">LARAVEL</text>

        <circle cx="202" cy="327" r="2" fill="#354047"/>

        <text x="218" y="331" fill="#77858C">LINUX</text>

        <circle cx="267" cy="327" r="2" fill="#354047"/>

        <text x="283" y="331" fill="#77858C">DRUPAL</text>

    </g>


    <!-- ===================================================== -->
    <!-- RIGHT SYSTEM PANEL                                     -->
    <!-- ===================================================== -->

    <rect
        x="760"
        y="103"
        width="365"
        height="220"
        rx="10"
        fill="#0D1117"
        fill-opacity="0.68"
        stroke="#1C252B"
    />


    <!-- panel title -->

    <text
        x="790"
        y="137"
        class="mono"
        font-size="11"
        letter-spacing="2"
        fill="#536168"
    >
        SYSTEM.STATUS
    </text>

    <line
        x1="790"
        y1="153"
        x2="1095"
        y2="153"
        stroke="#1C252B"
    />


    <!-- user -->

    <text
        x="790"
        y="185"
        class="mono"
        font-size="12"
        fill="#536168"
    >
        USER
    </text>

    <text
        x="1095"
        y="185"
        text-anchor="end"
        class="mono"
        font-size="12"
        fill="#D5DDE0"
    >
        vnunez
    </text>


    <!-- shell -->

    <text
        x="790"
        y="217"
        class="mono"
        font-size="12"
        fill="#536168"
    >
        SHELL
    </text>

    <text
        x="1095"
        y="217"
        text-anchor="end"
        class="mono"
        font-size="12"
        fill="#D5DDE0"
    >
        curiosity
    </text>


    <!-- mode -->

    <text
        x="790"
        y="249"
        class="mono"
        font-size="12"
        fill="#536168"
    >
        MODE
    </text>

    <text
        x="1095"
        y="249"
        text-anchor="end"
        class="mono"
        font-size="12"
        fill="#D5DDE0"
    >
        building
    </text>


    <!-- status -->

    <text
        x="790"
        y="289"
        class="mono"
        font-size="12"
        fill="#536168"
    >
        STATUS
    </text>

    <!-- glowing status -->

    <circle
        cx="1036"
        cy="285"
        r="9"
        fill="#47E0FF"
        fill-opacity="0.07"
        filter="url(#smallGlow)"
    />

    <circle
        cx="1036"
        cy="285"
        r="4"
        fill="#47E0FF"
    />

    <text
        x="1095"
        y="289"
        text-anchor="end"
        class="mono"
        font-size="12"
        letter-spacing="1"
        fill="#47E0FF"
    >
        ONLINE
    </text>


    <!-- ===================================================== -->
    <!-- BOTTOM STATUS BAR                                      -->
    <!-- ===================================================== -->

    <line
        x1="1"
        y1="371"
        x2="1199"
        y2="371"
        stroke="#1C252B"
    />


    <circle
        cx="75"
        cy="395"
        r="3"
        fill="#47E0FF"
    />

    <text
        x="88"
        y="399"
        class="mono"
        font-size="10"
        letter-spacing="1"
        fill="#77858C"
    >
        SYSTEM ONLINE
    </text>


    <text
        x="1125"
        y="399"
        text-anchor="end"
        class="mono"
        font-size="10"
        letter-spacing="1"
        fill="#536168"
    >
        GALICIA / ES
    </text>

</svg>
